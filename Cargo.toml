# Standalone package (it lives inside the Limen repo tree but is its own module).
[workspace]

[package]
name = "programs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lists programs installed on THIS machine (Windows uninstall registry / Linux packages, XDG desktop entries, ~/.local, /opt)."
repository = "https://github.com/CRC-BARRACUDA/limen-programs"

[lib]
name = "programs"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
limen-sdk-rust = { git = "https://github.com/CRC-BARRACUDA/Limen.git" }

# Windows-only: read the "Uninstall" registry keys (installed programs).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
