# Українські рядки для модуля programs.
# `[module] title`/`description` — те, що менеджер показує на картці модуля
# вибраною мовою; решта — власні рядки інтерфейсу модуля, які шукаються під час
# малювання через `host.locale()` + `Catalog` із SDK.

# Назва вікна/вкладки модуля, така сама, як `[module] title`, щоб заголовок
# панелі збігався з вкладкою і карткою.
title = "Список встановлених програм"

[module]
title = "Список встановлених програм"
description = "Показує програми, встановлені на ЦЬОМУ комп'ютері — реєстр видалення Windows, пакунки Linux (dpkg/rpm/flatpak/snap), записи робочого столу XDG та встановлене в домівці (~/.local, /opt)."

[idle]
hint = "Перевірте, які програми встановлено на цьому комп'ютері."
scan = "Перевірити"

# Шість стовпців таблиці. Значення — це дані, а не текст (джерело зветься
# «dpkg» будь-якою мовою), тому перекладено лише заголовки.
[table]
name = "Назва"
version = "Версія"
publisher = "Видавець"
source = "Джерело"
scope = "Область"
location = "Розташування"

[view]
search = "Пошук"
search_hint = "назва, версія, видавець, джерело, розташування…"
refresh = "Оновити"
make_report = "Створити звіт"
row_hint = "Клацніть рядок правою кнопкою, щоб побачити дії; подвійним клацанням — щоб відкрити подробиці."
heading = "Встановлені програми ({total}) — {shown}"
no_matches = "нічого не знайдено"
shown = "показано {from}–{to} з {total} · сторінка {page}/{pages}"
prev = "‹ Назад"
next = "Далі ›"

[menu]
about = "Подробиці"
about_tab = "Відкрити в новій вкладці"
open_location = "Відкрити теку"
open_file = "Відкрити файл"
reveal = "Показати в провіднику"
copy_path = "Копіювати шлях"

[about]
title = "Програма"
close = "Закрити"
stale = "Цього запису немає в останній перевірці — виконайте її ще раз."
unknown = "—"

[report]
title = "Створити звіт"
options = "Параметри звіту"
output = "Формат"
include = "Включити"
show = "Показати"
generate = "Створити"
result_title = "Звіт"
exported = "Звіт збережено"
exported_note = "Документ створено і відкрито у вашій типовій програмі."
failed = "Не вдалося створити звіт"

# Варіанти у формі звіту. Форма повертає той напис, який показала, тому їх
# зіставляють із цим самим списком — див. `choice` у report.rs.
[report.format]
view = "У застосунку"
markdown = "Markdown"
html = "HTML"
csv = "CSV"

[report.content]
all = "Таблиці та діаграми"
tables = "Лише таблиці"
charts = "Лише діаграми"

[report.scope]
all = "Усі програми"
system = "Лише системні"
user = "Лише користувацькі"

# Те, що написано в самому створеному документі.
[report.doc]
title = "Звіт про встановлені програми"
subtitle = "{total} програм · {system} системних · {user} користувацьких"
total = "Усього програм: {total}"
system = "Системних: {system}"
user = "Користувацьких: {user}"
chart_by_source = "Програми за джерелом"
section = "Встановлені програми"

# Побіжні сповіщення в кутку.
[notice]
scanned = "Знайдено програм: {total}."
none = "Встановлених програм не знайдено."
copied = "Шлях скопійовано в буфер обміну."
no_clipboard = "Нічого не скопійовано: немає засобу роботи з буфером обміну."
nothing_to_open = "Для цього запису не записано розташування, яке можна відкрити."
stale = "Цього запису немає в останній перевірці."
report_done = "Звіт збережено."
report_failed = "Не вдалося створити звіт."
